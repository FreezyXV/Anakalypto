<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anakalypto">
  <!--
    Marque d'onglet. Fond ardoise plutot que papier ou encre: un carre presque noir
    disparait dans une barre d'onglets sombre, un carre presque blanc dans une barre
    claire. L'ardoise tient dans les deux.
    Le A est trace en filets, le meme vocabulaire que les reglures du site.
  -->
  <rect width="32" height="32" fill="#2f3d47" />
  <path
    d="M8 24.5 16 7.5 24 24.5"
    fill="none"
    stroke="#fbfaf8"
    stroke-width="2.2"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <path d="M11.4 18.6h9.2" fill="none" stroke="#fbfaf8" stroke-width="2.2" stroke-linecap="square" />
</svg>
